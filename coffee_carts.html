<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☕ עגלות קפה אהובות</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--espresso:#130800;--dark-roast:#1e0e00;--roast:#2d1500;--medium:#4a2500;--caramel:#c47a2b;--golden:#e8a030;--cream:#f5ead8;--muted:rgba(245,234,216,0.45);--border:rgba(196,122,43,0.2);--visited:#2ecc71;--visited-bg:rgba(46,204,113,0.12);--danger:#e74c3c;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--espresso);color:var(--cream);font-family:'Heebo',sans-serif;min-height:100vh;}
header{padding:50px 24px 30px;text-align:center;background:linear-gradient(to bottom,rgba(196,122,43,0.07),transparent);border-bottom:1px solid var(--border);}
.header-icon{font-size:2.5rem;display:block;margin-bottom:10px;}
h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,3rem);color:var(--caramel);}
.subtitle{font-size:0.78rem;color:var(--muted);letter-spacing:4px;text-transform:uppercase;margin-top:8px;}
.controls{position:sticky;top:0;z-index:50;background:rgba(19,8,0,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.search-box{flex:1;min-width:140px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;padding:9px 14px;color:var(--cream);font-family:'Heebo',sans-serif;font-size:0.88rem;outline:none;direction:rtl;}
.search-box::placeholder{color:var(--muted);}
.tab-group{display:flex;gap:4px;}
.tab-btn{background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:8px;font-family:'Heebo',sans-serif;font-size:0.82rem;cursor:pointer;white-space:nowrap;}
.tab-btn.active{background:var(--caramel);color:var(--espresso);border-color:var(--caramel);font-weight:700;}
.filter-btn{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--muted);padding:8px 12px;border-radius:8px;font-family:'Heebo',sans-serif;font-size:0.78rem;cursor:pointer;white-space:nowrap;}
.filter-btn.active{border-color:var(--visited);color:var(--visited);background:var(--visited-bg);}
.count-badge{background:var(--border);color:var(--caramel);padding:6px 12px;border-radius:20px;font-size:0.8rem;font-weight:600;white-space:nowrap;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding:24px 20px 110px;max-width:1200px;margin:0 auto;}
.card{background:var(--dark-roast);border-radius:18px;overflow:hidden;border:1px solid var(--border);position:relative;transition:transform 0.25s,box-shadow 0.25s;animation:fadeUp 0.4s ease both;}
.card:hover{transform:translateY(-4px);box-shadow:0 20px 50px rgba(0,0,0,0.6);}
.card.is-visited{border-color:rgba(46,204,113,0.3);}
.card.is-visited .card-img-wrap::after{content:'✓ ביקרתי';position:absolute;top:12px;right:12px;background:var(--visited);color:#000;font-size:0.68rem;font-weight:700;padding:3px 10px;border-radius:10px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.card-img-wrap{position:relative;height:200px;overflow:hidden;background:var(--roast);}
.card-img{width:100%;height:100%;object-fit:cover;transition:transform 0.4s;display:block;}
.card:hover .card-img{transform:scale(1.06);}
.card-img-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--roast),var(--medium));}
.card-img-placeholder .big-emoji{font-size:3rem;}
.unknown-badge{position:absolute;top:12px;left:12px;background:rgba(196,122,43,0.88);color:var(--espresso);font-size:0.68rem;font-weight:700;padding:3px 10px;border-radius:10px;}
.delete-btn{position:absolute;bottom:12px;left:12px;background:rgba(231,76,60,0.15);border:1px solid rgba(231,76,60,0.35);color:rgba(231,76,60,0.7);cursor:pointer;font-size:0.72rem;font-weight:700;padding:5px 11px;border-radius:20px;display:flex;align-items:center;gap:4px;transition:all 0.2s;z-index:10;}
.delete-btn:hover{background:rgba(231,76,60,0.3);color:var(--danger);}
.card-body{padding:16px;}
.cart-name{font-family:'Playfair Display',serif;font-size:1.25rem;color:var(--golden);margin-bottom:3px;}
.cart-sub{font-size:0.72rem;color:var(--muted);font-style:italic;margin-bottom:7px;}
.cart-location{font-size:0.8rem;color:var(--muted);margin-bottom:12px;display:flex;align-items:flex-start;gap:4px;line-height:1.4;}
.rating-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.stars{display:flex;gap:2px;cursor:pointer;}
.star{font-size:1.1rem;transition:transform 0.1s;user-select:none;}
.star:hover{transform:scale(1.35);}
.notes-label{font-size:0.7rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:5px;}
.notes-area{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:9px;padding:9px 11px;color:var(--cream);font-family:'Heebo',sans-serif;font-size:0.84rem;resize:vertical;min-height:58px;outline:none;direction:rtl;line-height:1.5;}
.notes-area::placeholder{color:rgba(245,234,216,0.2);}
.card-footer{display:flex;align-items:center;gap:7px;margin-top:12px;flex-wrap:wrap;}
.ig-btn{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);color:white;padding:7px 13px;border-radius:18px;font-size:0.76rem;font-weight:600;text-decoration:none;white-space:nowrap;}
.waze-btn{display:inline-flex;align-items:center;gap:5px;background:rgba(0,200,100,0.1);border:1px solid rgba(0,200,100,0.25);color:#00e676;padding:7px 13px;border-radius:18px;font-size:0.76rem;font-weight:600;text-decoration:none;white-space:nowrap;cursor:pointer;}
.maps-btn{display:inline-flex;align-items:center;gap:5px;background:rgba(66,133,244,0.1);border:1px solid rgba(66,133,244,0.25);color:#4a90d9;padding:7px 13px;border-radius:18px;font-size:0.76rem;font-weight:600;text-decoration:none;white-space:nowrap;cursor:pointer;}
.visited-btn{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);color:var(--muted);padding:7px 13px;border-radius:18px;font-size:0.76rem;font-weight:600;cursor:pointer;margin-right:auto;white-space:nowrap;}
.visited-btn.visited{background:var(--visited-bg);border-color:rgba(46,204,113,0.4);color:var(--visited);}
.inline-input{width:100%;background:rgba(255,255,255,0.06);border:1px dashed rgba(196,122,43,0.4);border-radius:8px;padding:7px 10px;color:var(--cream);font-family:'Heebo',sans-serif;font-size:0.82rem;outline:none;direction:rtl;margin-bottom:7px;}
.inline-input::placeholder{color:rgba(245,234,216,0.25);}
#view-map{display:none;padding:20px 20px 110px;max-width:1200px;margin:0 auto;}
.map-intro{background:var(--dark-roast);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:18px;}
.map-intro p{font-size:0.84rem;color:var(--muted);line-height:1.5;}
.map-list{display:flex;flex-direction:column;gap:10px;}
.map-item{background:var(--dark-roast);border:1px solid var(--border);border-radius:12px;padding:13px 16px;display:flex;align-items:center;gap:14px;}
.map-item.is-visited{border-color:rgba(46,204,113,0.25);}
.map-dot{width:11px;height:11px;border-radius:50%;background:var(--caramel);flex-shrink:0;}
.map-dot.visited{background:var(--visited);}
.map-item-info{flex:1;}
.map-item-name{font-family:'Playfair Display',serif;font-size:0.98rem;color:var(--golden);}
.map-item-loc{font-size:0.77rem;color:var(--muted);margin-top:2px;}
.map-item-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.map-del{background:none;border:none;color:rgba(231,76,60,0.5);cursor:pointer;font-size:0.9rem;padding:4px 6px;border-radius:6px;}
.map-del:hover{color:var(--danger);}
.fab{position:fixed;bottom:28px;left:28px;width:54px;height:54px;border-radius:50%;background:var(--caramel);color:var(--espresso);border:none;font-size:1.6rem;cursor:pointer;box-shadow:0 8px 28px rgba(196,122,43,0.55);display:flex;align-items:center;justify-content:center;z-index:100;transition:transform 0.25s;}
.fab:hover{transform:scale(1.12) rotate(90deg);}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);z-index:200;align-items:center;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.modal{background:var(--dark-roast);border-radius:20px;padding:28px;width:100%;max-width:420px;border:1px solid rgba(196,122,43,0.3);direction:rtl;animation:slideUp 0.3s ease;max-height:90vh;overflow-y:auto;}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.modal-title{font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--caramel);margin-bottom:20px;}
.field-label{font-size:0.72rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:5px;}
.modal input{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;padding:11px 13px;color:var(--cream);font-family:'Heebo',sans-serif;font-size:0.9rem;margin-bottom:13px;outline:none;direction:rtl;}
.modal input::placeholder{color:rgba(245,234,216,0.25);}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:4px;}
.btn-add{background:var(--caramel);color:var(--espresso);border:none;padding:10px 24px;border-radius:10px;font-family:'Heebo',sans-serif;font-weight:700;font-size:0.9rem;cursor:pointer;}
.btn-cancel{background:transparent;color:var(--muted);border:1px solid rgba(245,234,216,0.15);padding:10px 18px;border-radius:10px;font-family:'Heebo',sans-serif;font-size:0.9rem;cursor:pointer;}
.confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);z-index:300;align-items:center;justify-content:center;padding:20px;}
.confirm-overlay.open{display:flex;}
.confirm-box{background:var(--dark-roast);border-radius:16px;padding:28px;width:100%;max-width:360px;border:1px solid rgba(196,122,43,0.3);direction:rtl;text-align:center;animation:slideUp 0.25s ease;}
.confirm-box h3{font-family:'Playfair Display',serif;color:var(--golden);margin-bottom:10px;font-size:1.2rem;}
.confirm-box p{color:var(--muted);font-size:0.88rem;margin-bottom:22px;line-height:1.5;}
.confirm-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.btn-del{background:var(--danger);color:white;border:none;padding:10px 22px;border-radius:10px;font-family:'Heebo',sans-serif;font-weight:700;font-size:0.9rem;cursor:pointer;}
.btn-ok{background:var(--caramel);color:var(--espresso);border:none;padding:10px 22px;border-radius:10px;font-family:'Heebo',sans-serif;font-weight:700;font-size:0.9rem;cursor:pointer;}
.btn-merge{background:rgba(46,204,113,0.8);color:#000;border:none;padding:10px 22px;border-radius:10px;font-family:'Heebo',sans-serif;font-weight:700;font-size:0.9rem;cursor:pointer;}
.btn-cc{background:transparent;color:var(--muted);border:1px solid rgba(245,234,216,0.15);padding:10px 18px;border-radius:10px;font-family:'Heebo',sans-serif;font-size:0.9rem;cursor:pointer;}
#toast{display:none;position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(30,14,0,0.95);border:1px solid var(--caramel);color:var(--cream);padding:10px 22px;border-radius:30px;font-size:0.88rem;z-index:500;white-space:nowrap;}
</style>
</head>
<body>
<header>
  <span class="header-icon">☕</span>
  <h1>עגלות קפה אהובות</h1>
  <p class="subtitle">האוסף האישי שלי</p>
</header>

<div class="controls">
  <input class="search-box" type="text" placeholder="חפש עגלה או מיקום..." oninput="doFilter(this.value)" />
  <div class="tab-group">
    <button class="tab-btn active" onclick="setView('grid',this)">🃏 כרטיסים</button>
    <button class="tab-btn" onclick="setView('map',this)">🗺 רשימה</button>
  </div>
  <button class="filter-btn" id="filter-visited" onclick="toggleVisitedFilter()">✓ ביקרתי</button>
  <span class="count-badge" id="count">0 עגלות</span>
  <button class="filter-btn" onclick="exportData()">📤 ייצא</button>
  <label class="filter-btn" style="cursor:pointer">📥 ייבא<input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)"></label>
</div>

<div id="view-grid"><div class="grid" id="grid"></div></div>
<div id="view-map">
  <div class="map-intro"><p>לחץ Waze לניווט ישיר לכל עגלה.<br>🟢 ירוק = ביקרת &nbsp;|&nbsp; 🟠 כתום = עוד לא</p></div>
  <div class="map-list" id="map-list"></div>
</div>
<button class="fab" onclick="openAddModal()">+</button>

<!-- ADD MODAL -->
<div class="overlay" id="add-overlay">
  <div class="modal">
    <div class="modal-title">➕ הוסף עגלת קפה</div>
    <div class="field-label">שם העגלה *</div>
    <input type="text" id="f-name" placeholder="שם העגלה" />
    <div class="field-label">מיקום</div>
    <input type="text" id="f-loc" placeholder="עיר, שכונה, מושב..." />
    <div class="field-label">קישור אינסטגרם</div>
    <input type="text" id="f-ig" placeholder="https://www.instagram.com/..." />
    <div class="field-label">קישור לתמונה</div>
    <input type="text" id="f-img" placeholder="https://..." />
    <div class="field-label">קישור Waze</div>
    <input type="text" id="f-waze" placeholder="https://waze.com/ul?q=..." />
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeAddModal()">ביטול</button>
      <button class="btn-add" onclick="addCart()">הוסף ☕</button>
    </div>
  </div>
</div>

<!-- DELETE CONFIRM -->
<div class="confirm-overlay" id="del-overlay">
  <div class="confirm-box">
    <h3>🗑 מחיקת עגלה</h3>
    <p id="del-msg"></p>
    <div class="confirm-btns">
      <button class="btn-cc" onclick="closeDelModal()">ביטול</button>
      <button class="btn-del" onclick="doDelete()">כן, מחק</button>
    </div>
  </div>
</div>

<!-- IMPORT CONFIRM -->
<div class="confirm-overlay" id="imp-overlay">
  <div class="confirm-box">
    <h3>📥 ייבוא רשימה</h3>
    <p id="imp-msg"></p>
    <div class="confirm-btns" style="flex-direction:column;align-items:stretch">
      <button class="btn-ok" onclick="doImportReplace()">🔄 החלף את כל הרשימה</button>
      <button class="btn-merge" onclick="doImportMerge()">➕ מזג — הוסף עגלות חדשות בלבד</button>
      <button class="btn-cc" onclick="closeImpModal()">ביטול</button>
    </div>
  </div>
</div>

<div id="toast"></div>

  {id:12, name:"קפה בורשטיין", sub:"Burstein Coffee & Bakery", location:"האומנות 16\nמתחם פולג, נתניה", ig:"https://www.instagram.com/bursteinpoleg/", waze:"waze://?q=%D7%94%D7%90%D7%95%D7%9E%D7%A0%D7%95%D7%AA+16+%D7%A4%D7%95%D7%9C%D7%92+%D7%A0%D7%AA%D7%A0%D7%99%D7%94&navigate=yes", img:"https://images.unsplash.com/photo-1442512595331-e89e73853f31?w=700&q=85", notes:"", rating:0, visited:false, unknown:false},
  {id:13, name:"גילטי", sub:"GILTI — עגלת קפה ומאפייה", location:"מושב עדנים\nליד מגרש הכדורסל", ig:"https://www.instagram.com/gilti_family_bakery/", waze:"waze://?q=%D7%92%D7%99%D7%9C%D7%98%D7%99+%D7%A2%D7%92%D7%9C%D7%AA+%D7%A7%D7%A4%D7%94+%D7%9E%D7%95%D7%A9%D7%91+%D7%A2%D7%93%D7%A0%D7%99%D7%9D&navigate=yes", img:"https://images.unsplash.com/photo-1481391319762-47dff72954d9?w=700&q=85", notes:"", rating:0, visited:false, unknown:false},
  {id:14, name:"אסתריקה", sub:"Esterika Truck על הירקון", location:"מתחם המועצה האזורית\nדרום השרון", ig:"https://www.instagram.com/esterika_cafe/", waze:"waze://?q=%D7%90%D7%A1%D7%AA%D7%A8%D7%99%D7%A7%D7%94+truck+%D7%99%D7%A8%D7%A7%D7%95%D7%9F&navigate=yes", img:"https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=700&q=85", notes:"", rating:0, visited:false, unknown:false}
];

var filterVal = '';
var showOnlyVisited = false;
var pendingDelId = null;
var pendingImport = null;
var toastTimer = null;

function load() {
  try {
    var s = localStorage.getItem(KEY);
    if (!s) return INITIAL;
    var d = JSON.parse(s);
    var shulke = d.find(function(x) { return x.id === 1; });
    if (shulke && !shulke.imgPos) { shulke.imgPos = 'center 70%'; save(d); }
    return d;
  } catch(e) { return INITIAL; }
}
function save(d) {
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e) {}
}

function igLabel(url) {
  if (!url) return null;
  var m = url.match(/instagram\.com\/([^/?#\n]+)/);
  if (!m) return 'Instagram';
  var p = m[1].split('/').filter(Boolean);
  return (p[0] === 'reel' || p[0] === 'p') ? '📽 Reel' : '@' + p[0];
}

function openWaze(e, wazeUrl) {
  e.preventDefault();
  var q = wazeUrl.replace('waze://?q=','').replace('&navigate=yes','');
  window.open('https://waze.com/ul?q=' + q + '&navigate=yes', '_blank');
}

function openMaps(e, q) {
  e.preventDefault();
  // comgooglemaps:// לא עובד מ-iframe, אז נשתמש ב-universal link
  window.open('https://maps.google.com/maps?q=' + q, '_blank');
}

function igUsername(url) {
  if (!url) return null;
  var m = url.match(/instagram\.com\/([^/?#\n]+)/);
  if (!m) return null;
  var seg = m[1].split('/').filter(Boolean);
  return (seg[0] === 'reel' || seg[0] === 'p') ? null : seg[0];
}

function openIG(e, url) {
  e.preventDefault();
  var username = igUsername(url);
  if (username) {
    // ניסיון לפתוח ישירות באפליקציה
    var appUrl = 'instagram://user?username=' + username;
    var start = Date.now();
    window.location = appUrl;
    // אם האפליקציה לא נפתחה תוך 1.5 שניות - נפתח בדפדפן
    setTimeout(function() {
      if (Date.now() - start < 2000) {
        window.open(url, '_blank');
      }
    }, 1500);
  } else {
    // reel או קישור ישיר - פתח בדפדפן
    window.open(url, '_blank');
  }
}

function starsHtml(id, r) {
  var s = '';
  for (var i = 1; i <= 5; i++) {
    s += '<span class="star" onclick="rate(' + id + ',' + i + ')">' + (i <= r ? '★' : '☆') + '</span>';
  }
  return s;
}

function filtered(data) {
  return data.filter(function(c) {
    if (showOnlyVisited && !c.visited) return false;
    if (!filterVal) return true;
    var q = filterVal.toLowerCase();
    return (c.name||'').toLowerCase().indexOf(q) >= 0 || (c.location||'').toLowerCase().indexOf(q) >= 0;
  });
}

function renderGrid(data) {
  var show = filtered(data);
  document.getElementById('count').textContent = show.length + ' עגלות';
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  if (!show.length) { grid.innerHTML = '<div style="text-align:center;padding:80px 20px;color:var(--muted);grid-column:1/-1">לא נמצאו עגלות ☕</div>'; return; }
  show.forEach(function(c, i) {
    var el = document.createElement('div');
    el.className = 'card' + (c.visited ? ' is-visited' : '');
    el.style.animationDelay = (i * 0.05) + 's';
    var locLines = (c.location||'').split('\n').join('<br>');
    var label = igLabel(c.ig);
    var imgPos = c.imgPos ? 'object-position:' + c.imgPos + ';' : '';
    var imgHtml = c.img
      ? '<img class="card-img" src="' + c.img + '" alt="" style="' + imgPos + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
        + '<div class="card-img-placeholder" style="display:none"><span class="big-emoji">☕</span></div>'
      : '<div class="card-img-placeholder"><span class="big-emoji">☕</span></div>';
    var bodyHtml = c.unknown
      ? '<input class="inline-input" value="' + (c.name||'') + '" placeholder="✏️ שם העגלה..." onchange="upName(' + c.id + ',this.value)">'
        + '<input class="inline-input" value="' + (c.location||'') + '" placeholder="מיקום..." onchange="upLoc(' + c.id + ',this.value)">'
      : '<div class="cart-name">' + (c.name||'') + '</div>'
        + (c.sub ? '<div class="cart-sub">' + c.sub + '</div>' : '')
        + '<div class="cart-location">📍 <span>' + locLines + '</span></div>';
    var footerLinks = '';
    if (c.ig) footerLinks += '<a class="ig-btn" href="' + c.ig + '" onclick="openIG(event,\'' + c.ig + '\')">' + label + '</a>';
    var wazeQ = c.waze ? c.waze.replace('waze://?q=','').replace('&navigate=yes','') : '';
    if (c.waze) footerLinks += '<a class="waze-btn" href="' + c.waze + '" onclick="openWaze(event,\'' + c.waze + '\')">🚗 Waze</a>';
    if (wazeQ) footerLinks += '<a class="maps-btn" href="#" onclick="openMaps(event,\'' + wazeQ + '\')">🗺 Maps</a>';
    el.innerHTML =
      '<div class="card-img-wrap">'
        + imgHtml
        + (c.unknown ? '<div class="unknown-badge">לא ידוע</div>' : '')
        + '<button class="delete-btn" onclick="askDelete(' + c.id + ')">🗑 מחק</button>'
      + '</div>'
      + '<div class="card-body">'
        + bodyHtml
        + '<div class="rating-row"><div class="stars">' + starsHtml(c.id, c.rating) + '</div>'
        + (c.rating ? '<span style="font-size:0.78rem;color:var(--muted)">' + c.rating + '/5</span>' : '') + '</div>'
        + '<div class="notes-label">הערות אישיות</div>'
        + '<textarea class="notes-area" placeholder="מה אהבת? שעות, מנות מומלצות..." onchange="upNote(' + c.id + ',this.value)">' + (c.notes||'') + '</textarea>'
        + '<div class="card-footer">'
          + '<button class="visited-btn' + (c.visited ? ' visited' : '') + '" onclick="toggleVisited(' + c.id + ',this)">' + (c.visited ? '✓ ביקרתי' : '☐ ביקרתי?') + '</button>'
          + footerLinks
        + '</div>'
      + '</div>';
    grid.appendChild(el);
  });
}

function renderMapList(data) {
  var show = filtered(data);
  var list = document.getElementById('map-list');
  list.innerHTML = '';
  show.forEach(function(c) {
    var item = document.createElement('div');
    item.className = 'map-item' + (c.visited ? ' is-visited' : '');
    var name = c.name || (c.ig ? igLabel(c.ig) : 'עגלה לא ידועה');
    var links = '';
    var wazeQ2 = c.waze ? c.waze.replace('waze://?q=','').replace('&navigate=yes','') : '';
    if (c.waze) links += '<a class="waze-btn" href="' + c.waze + '" onclick="openWaze(event,\'' + c.waze + '\')" style="padding:6px 10px;font-size:0.73rem">🚗 Waze</a>';
    if (wazeQ2) links += '<a class="maps-btn" href="#" onclick="openMaps(event,\'' + wazeQ2 + '\')" style="padding:6px 10px;font-size:0.73rem">🗺 Maps</a>';
    if (c.ig) links += '<a class="ig-btn" href="' + c.ig + '" onclick="openIG(event,\'' + c.ig + '\')" style="padding:6px 10px;font-size:0.73rem">' + igLabel(c.ig) + '</a>';
    item.innerHTML =
      '<div class="map-dot' + (c.visited ? ' visited' : '') + '"></div>'
      + '<div class="map-item-info">'
        + '<div class="map-item-name">' + name + '</div>'
        + (c.location ? '<div class="map-item-loc">📍 ' + (c.location||'').replace('\n',' · ') + '</div>' : '')
      + '</div>'
      + '<div class="map-item-actions">' + links
        + '<button class="map-del" onclick="askDelete(' + c.id + ')">🗑</button>'
      + '</div>';
    list.appendChild(item);
  });
}

function render() { var d = load(); renderGrid(d); renderMapList(d); }

function setView(v, btn) {
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('view-grid').style.display = v === 'grid' ? 'block' : 'none';
  document.getElementById('view-map').style.display = v === 'map' ? 'block' : 'none';
}

function doFilter(v) { filterVal = v; render(); }

function toggleVisitedFilter() {
  showOnlyVisited = !showOnlyVisited;
  document.getElementById('filter-visited').classList.toggle('active', showOnlyVisited);
  render();
}

function toggleVisited(id, btn) {
  var d = load();
  var c = d.find(function(x) { return x.id === id; });
  if (!c) return;
  c.visited = !c.visited;
  save(d);
  btn.classList.toggle('visited', c.visited);
  btn.textContent = c.visited ? '✓ ביקרתי' : '☐ ביקרתי?';
  var card = btn.closest('.card');
  if (card) card.classList.toggle('is-visited', c.visited);
  renderMapList(d);
}

function rate(id, r) {
  var d = load();
  var c = d.find(function(x) { return x.id === id; });
  if (c) { c.rating = r; save(d); renderGrid(d); }
}

function upNote(id, v) {
  var d = load();
  var c = d.find(function(x) { return x.id === id; });
  if (c) { c.notes = v; save(d); }
}

function upName(id, v) {
  var d = load();
  var c = d.find(function(x) { return x.id === id; });
  if (c) { c.name = v; if (v) c.unknown = false; save(d); }
}

function upLoc(id, v) {
  var d = load();
  var c = d.find(function(x) { return x.id === id; });
  if (c) { c.location = v; save(d); }
}

// DELETE
function askDelete(id) {
  pendingDelId = id;
  var d = load();
  var c = d.find(function(x) { return x.id === id; });
  document.getElementById('del-msg').textContent = 'למחוק את "' + (c ? c.name || 'עגלה' : 'עגלה') + '"?';
  document.getElementById('del-overlay').classList.add('open');
}
function closeDelModal() { document.getElementById('del-overlay').classList.remove('open'); pendingDelId = null; }
function doDelete() {
  if (!pendingDelId) return;
  var d = load().filter(function(x) { return x.id !== pendingDelId; });
  save(d); closeDelModal(); render();
}

// ADD
function openAddModal() { document.getElementById('add-overlay').classList.add('open'); }
function closeAddModal() {
  document.getElementById('add-overlay').classList.remove('open');
  ['f-name','f-loc','f-ig','f-img','f-waze'].forEach(function(id) { document.getElementById(id).value = ''; });
}
function addCart() {
  var name = document.getElementById('f-name').value.trim();
  if (!name) { document.getElementById('f-name').focus(); return; }
  var d = load();
  d.push({
    id: Date.now(), name: name, sub: '',
    location: document.getElementById('f-loc').value.trim(),
    ig: document.getElementById('f-ig').value.trim(),
    img: document.getElementById('f-img').value.trim(),
    waze: document.getElementById('f-waze').value.trim(),
    notes: '', rating: 0, visited: false, unknown: false
  });
  save(d); closeAddModal(); render();
}

// EXPORT
function exportData() {
  var d = load();
  var blob = new Blob([JSON.stringify(d, null, 2)], {type: 'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'עגלות_קפה.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('📤 הרשימה יוצאה בהצלחה!');
}

// IMPORT
function importData(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var parsed = JSON.parse(ev.target.result);
      if (!Array.isArray(parsed)) throw new Error('not array');
      pendingImport = parsed;
      var cur = load();
      var newCount = parsed.filter(function(x) { return !cur.find(function(c) { return c.id === x.id; }); }).length;
      document.getElementById('imp-msg').textContent = 'הקובץ מכיל ' + parsed.length + ' עגלות. שלך: ' + cur.length + '. חדשות: ' + newCount + '.';
      document.getElementById('imp-overlay').classList.add('open');
    } catch(err) {
      showToast('❌ קובץ לא תקין');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
}
function closeImpModal() { document.getElementById('imp-overlay').classList.remove('open'); pendingImport = null; }
function doImportReplace() {
  if (!pendingImport) return;
  save(pendingImport); closeImpModal(); render();
  showToast('✅ הרשימה הוחלפה בהצלחה!');
}
function doImportMerge() {
  if (!pendingImport) return;
  var cur = load();
  var added = pendingImport.filter(function(x) { return !cur.find(function(c) { return c.id === x.id; }); });
  save(cur.concat(added)); closeImpModal(); render();
  showToast('✅ נוספו ' + added.length + ' עגלות חדשות!');
}

// TOAST
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block'; t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.style.opacity = '0'; setTimeout(function() { t.style.display = 'none'; }, 300); }, 2800);
}

// CLOSE ON BG CLICK
document.getElementById('add-overlay').addEventListener('click', function(e) { if (e.target === e.currentTarget) closeAddModal(); });
document.getElementById('del-overlay').addEventListener('click', function(e) { if (e.target === e.currentTarget) closeDelModal(); });
document.getElementById('imp-overlay').addEventListener('click', function(e) { if (e.target === e.currentTarget) closeImpModal(); });

render();
</script>
</body>
</html>
