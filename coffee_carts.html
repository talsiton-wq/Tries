<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☕ עגלות קפה אהובות</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--espresso:#130800;--dark-roast:#1e0e00;--roast:#2d1500;--medium:#4a2500;--caramel:#c47a2b;--golden:#e8a030;--cream:#f5ead8;--muted:rgba(245,234,216,0.45);--border:rgba(196,122,43,0.2);--visited:#2ecc71;--visited-bg:rgba(46,204,113,0.12);--danger:#e74c3c;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--espresso);color:var(--cream);font-family:'Heebo',sans-serif;min-height:100vh;}
header{padding:50px 24px 30px;text-align:center;background:linear-gradient(to bottom,rgba(196,122,43,0.07),transparent);border-bottom:1px solid var(--border);}
.header-icon{font-size:2.5rem;display:block;margin-bottom:10px;}
h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,3rem);color:var(--caramel);}
.subtitle{font-size:0.78rem;color:var(--muted);letter-spacing:4px;text-transform:uppercase;margin-top:8px;}
.controls{position:sticky;top:0;z-index:50;background:rgba(19,8,0,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.search-box{flex:1;min-width:140px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;padding:9px 14px;color:var(--cream);font-family:'Heebo',sans-serif;font-size:0.88rem;outline:none;direction:rtl;}
.search-box::placeholder{color:var(--muted);}
.tab-group{display:flex;gap:4px;}
.tab-btn{background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:8px;font-family:'Heebo',sans-serif;font-size:0.82rem;cursor:pointer;white-space:nowrap;}
.tab-btn.active{background:var(--caramel);color:var(--espresso);border-color:var(--caramel);font-weight:700;}
.filter-btn{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--muted);padding:8px 12px;border-radius:8px;font-family:'Heebo',sans-serif;font-size:0.78rem;cursor:pointer;white-space:nowrap;}
.filter-btn.active{border-color:var(--visited);color:var(--visited);background:var(--visited-bg);}
.count-badge{background:var(--border);color:var(--caramel);padding:6px 12px;border-radius:20px;font-size:0.8rem;font-weight:600;white-space:nowrap;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding:24px 20px 110px;max-width:1200px;margin:0 auto;}
.card{background:var(--dark-roast);border-radius:18px;overflow:hidden;border:1px solid var(--border);position:relative;transition:transform 0.25s,box-shadow 0.25s;}
.card.anim{animation:fadeUp 0.4s ease both;}
.card:hover{transform:translateY(-4px);box-shadow:0 20px 50px rgba(0,0,0,0.6);}
.card.is-visited{border-color:rgba(46,204,113,0.3);}
.visited-badge{position:absolute;top:10px;right:10px;padding:5px 11px;border-radius:12px;font-size:0.69rem;font-weight:700;cursor:pointer;transition:all 0.25s;background:rgba(0,0,0,0.68);color:rgba(255,255,255,0.85);border:1.5px solid rgba(255,255,255,0.3);user-select:none;box-shadow:0 2px 8px rgba(0,0,0,0.55);}
.visited-badge.visited{background:rgba(39,174,96,0.95);border-color:rgba(255,255,255,0.4);color:#fff;box-shadow:0 2px 10px rgba(39,174,96,0.5);}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.card-img-wrap{position:relative;height:200px;overflow:hidden;background:var(--roast);}
.card-img{width:100%;height:100%;object-fit:cover;transition:transform 0.4s;display:block;}
.card:hover .card-img{transform:scale(1.06);}
.card-img-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--roast),var(--medium));}
.card-img-placeholder .big-emoji{font-size:3rem;}
.unknown-badge{position:absolute;top:12px;left:12px;background:rgba(196,122,43,0.88);color:var(--espresso);font-size:0.68rem;font-weight:700;padding:3px 10px;border-radius:10px;}
.delete-btn{background:none;border:none;color:rgba(231,76,60,0.4);cursor:pointer;font-size:1rem;padding:2px 4px;line-height:1;display:inline-flex;align-items:center;transition:color 0.2s;flex-shrink:0;}
.delete-btn:hover{color:var(--danger);}
.name-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:3px;}
.card-body{padding:16px;}
.cart-name{font-family:'Playfair Display',serif;font-size:1.25rem;color:var(--golden);margin-bottom:3px;}
.cart-sub{font-size:0.72rem;color:var(--muted);font-style:italic;margin-bottom:7px;}
.cart-location{font-size:0.8rem;color:var(--muted);margin-bottom:12px;display:flex;align-items:flex-start;gap:4px;line-height:1.4;}
.rating-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.stars{display:flex;gap:2px;cursor:pointer;}
.star{font-size:1.1rem;transition:transform 0.1s;user-select:none;}
.star:hover{transform:scale(1.35);}
.notes-label{font-size:0.7rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:5px;}
.notes-area{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:9px;padding:9px 11px;color:var(--cream);font-family:'Heebo',sans-serif;font-size:0.84rem;resize:vertical;min-height:58px;outline:none;direction:rtl;line-height:1.5;}
.notes-area::placeholder{color:rgba(245,234,216,0.2);}
.cart-note{display:flex;align-items:flex-start;gap:5px;margin:6px 0 2px;font-size:0.8rem;font-weight:700;color:#ffdd44;line-height:1.5;direction:rtl;}
.card-actions{display:flex;align-items:center;gap:7px;margin-top:10px;}
.card-footer{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:20px;padding-top:12px;border-top:1px solid var(--border);flex-wrap:nowrap;}
.ig-btn{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);color:white;padding:6px 10px;border-radius:18px;font-size:0.72rem;font-weight:600;text-decoration:none;white-space:nowrap;}
.waze-btn{display:inline-flex;align-items:center;gap:4px;background:rgba(0,200,100,0.1);border:1px solid rgba(0,200,100,0.25);color:#00e676;padding:6px 10px;border-radius:18px;font-size:0.72rem;font-weight:600;text-decoration:none;white-space:nowrap;cursor:pointer;}
.maps-btn{display:inline-flex;align-items:center;gap:4px;background:rgba(66,133,244,0.1);border:1px solid rgba(66,133,244,0.25);color:#4a90d9;padding:6px 10px;border-radius:18px;font-size:0.72rem;font-weight:600;text-decoration:none;white-space:nowrap;cursor:pointer;}
.wa-btn{display:inline-flex;align-items:center;gap:5px;background:rgba(37,211,102,0.1);border:1px solid rgba(37,211,102,0.25);color:#25d366;padding:7px 13px;border-radius:18px;font-size:0.76rem;font-weight:600;text-decoration:none;white-space:nowrap;cursor:pointer;}
.comments-section{margin-top:10px;border-top:1px solid var(--border);padding-top:8px;}
.comments-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.comments-title{font-size:0.75rem;color:var(--muted);font-weight:600;}
.add-comment-btn{background:rgba(196,122,43,0.15);border:1px solid rgba(196,122,43,0.35);color:var(--caramel);width:22px;height:22px;border-radius:50%;font-size:0.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.comment-item{background:rgba(255,255,255,0.04);border-radius:9px;padding:7px 10px;margin-bottom:5px;}
.comment-name{font-size:0.71rem;font-weight:700;color:var(--golden);}
.comment-text{font-size:0.8rem;color:var(--cream);margin-top:2px;white-space:pre-wrap;}
.comment-date{font-size:0.64rem;color:var(--muted);margin-top:3px;}
.comment-form{display:none;margin-top:7px;background:rgba(255,255,255,0.03);border-radius:10px;padding:10px;border:1px solid var(--border);}
.comment-form.open{display:block;}
.comment-input{width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--cream);font-family:'Heebo',sans-serif;font-size:0.82rem;outline:none;direction:rtl;margin-bottom:6px;resize:none;}
.comment-input::placeholder{color:var(--muted);}
.comment-submit{background:var(--caramel);color:var(--espresso);border:none;border-radius:8px;padding:6px 14px;font-family:'Heebo',sans-serif;font-size:0.8rem;font-weight:700;cursor:pointer;}
.inline-input{width:100%;background:rgba(255,255,255,0.06);border:1px dashed rgba(196,122,43,0.4);border-radius:8px;padding:7px 10px;color:var(--cream);font-family:'Heebo',sans-serif;font-size:0.82rem;outline:none;direction:rtl;margin-bottom:7px;}
.inline-input::placeholder{color:rgba(245,234,216,0.25);}
#view-map{display:none;padding:20px 20px 110px;max-width:1200px;margin:0 auto;}
.map-intro{background:var(--dark-roast);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:18px;}
.map-intro p{font-size:0.84rem;color:var(--muted);line-height:1.5;}
.map-list{display:flex;flex-direction:column;gap:10px;}
.map-item{background:var(--dark-roast);border:1px solid var(--border);border-radius:12px;padding:13px 16px;display:flex;align-items:center;gap:14px;}
.map-item.is-visited{border-color:rgba(46,204,113,0.25);}
.map-dot{width:11px;height:11px;border-radius:50%;background:var(--caramel);flex-shrink:0;}
.map-dot.visited{background:var(--visited);}
.map-item-info{flex:1;}
.map-item-name{font-family:'Playfair Display',serif;font-size:0.98rem;color:var(--golden);}
.map-item-loc{font-size:0.77rem;color:var(--muted);margin-top:2px;}
.map-item-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.map-del{background:none;border:none;color:rgba(231,76,60,0.5);cursor:pointer;font-size:0.9rem;padding:4px 6px;border-radius:6px;}
.map-del:hover{color:var(--danger);}
.fab{position:fixed;bottom:28px;left:28px;width:54px;height:54px;border-radius:50%;background:var(--caramel);color:var(--espresso);border:none;font-size:1.6rem;cursor:pointer;box-shadow:0 8px 28px rgba(196,122,43,0.55);display:flex;align-items:center;justify-content:center;z-index:100;transition:transform 0.25s;}
.fab:hover{transform:scale(1.12) rotate(90deg);}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);z-index:200;align-items:center;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.modal{background:var(--dark-roast);border-radius:20px;padding:28px;width:100%;max-width:420px;border:1px solid rgba(196,122,43,0.3);direction:rtl;animation:slideUp 0.3s ease;max-height:90vh;overflow-y:auto;}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.modal-title{font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--caramel);margin-bottom:20px;}
.field-label{font-size:0.72rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:5px;}
.modal input{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;padding:11px 13px;color:var(--cream);font-family:'Heebo',sans-serif;font-size:0.9rem;margin-bottom:13px;outline:none;direction:rtl;}
.modal input::placeholder{color:rgba(245,234,216,0.25);}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:4px;}
.btn-add{background:var(--caramel);color:var(--espresso);border:none;padding:10px 24px;border-radius:10px;font-family:'Heebo',sans-serif;font-weight:700;font-size:0.9rem;cursor:pointer;}
.btn-cancel{background:transparent;color:var(--muted);border:1px solid rgba(245,234,216,0.15);padding:10px 18px;border-radius:10px;font-family:'Heebo',sans-serif;font-size:0.9rem;cursor:pointer;}
.confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);z-index:300;align-items:center;justify-content:center;padding:20px;}
.confirm-overlay.open{display:flex;}
.confirm-box{background:var(--dark-roast);border-radius:16px;padding:28px;width:100%;max-width:360px;border:1px solid rgba(196,122,43,0.3);direction:rtl;text-align:center;animation:slideUp 0.25s ease;}
.confirm-box h3{font-family:'Playfair Display',serif;color:var(--golden);margin-bottom:10px;font-size:1.2rem;}
.confirm-box p{color:var(--muted);font-size:0.88rem;margin-bottom:22px;line-height:1.5;}
.confirm-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.btn-del{background:var(--danger);color:white;border:none;padding:10px 22px;border-radius:10px;font-family:'Heebo',sans-serif;font-weight:700;font-size:0.9rem;cursor:pointer;}
.btn-ok{background:var(--caramel);color:var(--espresso);border:none;padding:10px 22px;border-radius:10px;font-family:'Heebo',sans-serif;font-weight:700;font-size:0.9rem;cursor:pointer;}
.btn-merge{background:rgba(46,204,113,0.8);color:#000;border:none;padding:10px 22px;border-radius:10px;font-family:'Heebo',sans-serif;font-weight:700;font-size:0.9rem;cursor:pointer;}
.btn-cc{background:transparent;color:var(--muted);border:1px solid rgba(245,234,216,0.15);padding:10px 18px;border-radius:10px;font-family:'Heebo',sans-serif;font-size:0.9rem;cursor:pointer;}
#toast{display:none;position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(30,14,0,0.95);border:1px solid var(--caramel);color:var(--cream);padding:10px 22px;border-radius:30px;font-size:0.88rem;z-index:500;white-space:nowrap;}
.card-img[src="IMG_2464.jpeg"]{object-position:65% 80%;transform:scale(2);transform-origin:65% 80%;}
.img-gallery{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;}
.img-thumb{width:50px;height:50px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent;opacity:0.7;transition:all 0.2s;flex-shrink:0;}
.img-thumb.is-main{border-color:var(--golden);opacity:1;}
.img-thumb:hover{opacity:1;}
.img-upload-lbl{width:50px;height:50px;border-radius:8px;border:1px dashed rgba(196,122,43,0.4);background:rgba(255,255,255,0.03);color:var(--muted);font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.2s;}
.img-upload-lbl:hover{background:rgba(196,122,43,0.1);}
.cart-hours{font-size:0.8rem;color:var(--cream);margin-bottom:10px;display:flex;align-items:center;gap:5px;line-height:1.6;flex-wrap:wrap;}
.cart-hours .hours-text{color:var(--cream);opacity:0.85;}
.cart-hours .hours-empty{color:var(--muted);font-style:italic;}
.cart-hours .edit-hours-btn{background:none;border:none;color:var(--muted);font-size:0.75rem;cursor:pointer;padding:0 2px;line-height:1;flex-shrink:0;}
.open-badge{display:inline-flex;align-items:center;gap:4px;font-size:0.72rem;font-weight:700;padding:3px 10px;border-radius:12px;margin-bottom:8px;}
.open-badge.open{background:rgba(46,204,113,0.12);color:#2ecc71;border:1px solid rgba(46,204,113,0.3);}
.open-badge.closed{background:rgba(231,76,60,0.1);color:#e74c3c;border:1px solid rgba(231,76,60,0.2);}
.dist-badge{display:inline-flex;align-items:center;gap:3px;font-size:0.72rem;font-weight:600;padding:3px 9px;border-radius:12px;background:rgba(66,133,244,0.12);color:#4a90d9;border:1px solid rgba(66,133,244,0.25);margin-right:6px;}
.dist-badge.approx{background:rgba(180,130,50,0.12);color:#b08030;border-color:rgba(180,130,50,0.3);}
@keyframes spinCoffee{to{transform:rotate(360deg)}}
.claude-spinner{font-size:2.4rem;display:inline-block;animation:spinCoffee 1.5s linear infinite;}
.preview-field{margin-bottom:10px;}
.preview-field input{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;padding:9px 12px;color:var(--cream);font-family:'Heebo',sans-serif;font-size:0.87rem;outline:none;direction:rtl;}
</style>
</head>
<body>
<header>
  <span class="header-icon">☕</span>
  <h1>עגלות קפה אהובות</h1>
</header>

<div class="controls">
  <input class="search-box" type="text" placeholder="חפש עגלה או מיקום..." oninput="doFilter(this.value)" />
  <div class="tab-group">
    <button class="tab-btn active" onclick="setView('grid',this)">🃏 כרטיסים</button>
    <button class="tab-btn" onclick="setView('map',this)">🗺 רשימה</button>
  </div>
  <button class="filter-btn" id="filter-visited" onclick="toggleVisitedFilter()">✓ ביקרתי</button>
  <button class="filter-btn" id="filter-open" onclick="toggleOpenFilter()">🟢 פתוח עכשיו</button>
  <button class="filter-btn" id="sort-dist" onclick="toggleDistSort()">📍 קרוב אלי</button>
  <span class="count-badge" id="count">0 עגלות</span>
</div>

<div id="view-grid"><div class="grid" id="grid"></div></div>
<div id="view-map">
  <div class="map-intro"><p>לחץ Waze לניווט ישיר לכל עגלה.<br>🟢 ירוק = ביקרת &nbsp;|&nbsp; 🟠 כתום = עוד לא</p></div>
  <div class="map-list" id="map-list"></div>
</div>
<button class="fab" onclick="openAddModal()">+</button>

<!-- ADD MODAL -->
<div class="overlay" id="add-overlay">
  <div class="modal">
    <div class="modal-title">🔍 הוסף עגלת קפה</div>

    <!-- Step 1: search inputs -->
    <div id="modal-step1">
      <div class="field-label">שם העגלה *</div>
      <input type="text" id="f-name" placeholder="שם העגלה" onkeydown="if(event.key==='Enter')searchWithClaude()" />
      <div class="field-label">עיר / אזור <span style="font-weight:300;opacity:0.5">(אופציונלי)</span></div>
      <input type="text" id="f-city" placeholder="תל אביב, הרצליה..." onkeydown="if(event.key==='Enter')searchWithClaude()" />
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeAddModal()">ביטול</button>
        <button class="btn-add" onclick="searchWithClaude()">חפש ב-Claude 🤖</button>
      </div>
    </div>

    <!-- Step loading -->
    <div id="modal-step-loading" style="display:none;text-align:center;padding:30px 0">
      <div class="claude-spinner">☕</div>
      <p style="color:var(--muted);font-size:0.85rem;margin-top:14px">Claude מחפש מידע...</p>
    </div>

    <!-- Step 2: preview + confirm -->
    <div id="modal-step2" style="display:none">
      <div style="font-size:0.7rem;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px">תוצאה — ניתן לערוך לפני האישור</div>
      <div id="claude-preview"></div>
      <div class="modal-btns" style="margin-top:6px">
        <button class="btn-cancel" onclick="closeAddModal()">ביטול</button>
        <button class="btn-cancel" onclick="showAddStep1()">← חזור</button>
        <button class="btn-add" onclick="confirmAddCart()">אשר ☕</button>
      </div>
    </div>

    <!-- Step error -->
    <div id="modal-step-error" style="display:none">
      <p id="claude-error-msg" style="color:#e74c3c;font-size:0.85rem;margin-bottom:18px;line-height:1.5"></p>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeAddModal()">ביטול</button>
        <button class="btn-add" onclick="showAddStep1()">← נסה שוב</button>
      </div>
    </div>
  </div>
</div>

<!-- HOURS EDIT MODAL -->
<div class="confirm-overlay" id="hours-overlay">
  <div class="confirm-box" style="text-align:right">
    <h3>🕐 שעות פתיחה</h3>
    <input id="f-hours-edit" type="text" placeholder="א-ה: 07:00-17:00 | שישי: 07:00-13:00" style="width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;padding:11px 13px;color:var(--cream);font-family:'Heebo',sans-serif;font-size:0.9rem;margin:12px 0;outline:none;direction:rtl;">
    <div class="confirm-btns">
      <button class="btn-cc" onclick="closeHoursModal()">ביטול</button>
      <button class="btn-ok" onclick="doSaveHours()">שמור</button>
    </div>
  </div>
</div>

<!-- DELETE CONFIRM -->
<div class="confirm-overlay" id="del-overlay">
  <div class="confirm-box">
    <h3>🗑 מחיקת עגלה</h3>
    <p id="del-msg"></p>
    <div class="confirm-btns">
      <button class="btn-cc" onclick="closeDelModal()">ביטול</button>
      <button class="btn-del" onclick="doDelete()">כן, מחק</button>

function isOpen(hours) {
  if (!hours) return null;
  var dayMap = {'א':0,'ב':1,'ג':2,'ד':3,'ה':4,'ו':5,'ש':6};
  var now = new Date();
  var today = now.getDay();
  var curMin = now.getHours() * 60 + now.getMinutes();
  var segments = hours.split('|');
  for (var i = 0; i < segments.length; i++) {
    var seg = segments[i].trim();
    var col = seg.indexOf(':');
    if (col < 0) continue;
    var dayPart = seg.substring(0, col).replace(/׳/g,'').replace(/\s/g,'');
    var timePart = seg.substring(col + 1).trim();
    var days = [];
    var dash = dayPart.search(/[–\-]/);
    if (dash >= 0) {
      var s = dayMap[dayPart[0]], e = dayMap[dayPart[dayPart.length-1]];
      if (s !== undefined && e !== undefined) for (var d = s; d <= e; d++) days.push(d);
    } else {
      if (dayMap[dayPart[0]] !== undefined) days.push(dayMap[dayPart[0]]);
    }
    if (days.indexOf(today) < 0) continue;
    if (timePart.indexOf('סגור') >= 0) return false;
    var m = timePart.match(/(\d{1,2}):(\d{2})[–\-](\d{1,2}):(\d{2})/);
    if (!m) continue;
    var open = parseInt(m[1])*60+parseInt(m[2]);
    var close = parseInt(m[3])*60+parseInt(m[4]);
    return curMin >= open && curMin < close;
  }
  return false;
}

function haversine(lat1, lon1, lat2, lon2) {
  var R = 6371;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLon = (lon2 - lon1) * Math.PI / 180;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
          Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
          Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function parseWazeCoords(wazeUrl) {
  if (!wazeUrl) return null;
  var m = wazeUrl.match(/ll=([-\d.]+),([-\d.]+)/);
  if (m) return {lat: parseFloat(m[1]), lng: parseFloat(m[2])};
  var q = wazeUrl.replace('waze://?q=','').replace('&navigate=yes','');
  var m2 = q.match(/^(-?\d+\.\d+),(-?\d+\.\d+)$/);
  return m2 ? {lat: parseFloat(m2[1]), lng: parseFloat(m2[2])} : null;
}

var _geocodePending = {};

function cityLookup(location) {
  if (!location) return null;
  // Try full string, then each line separately (last line is usually the city)
  var candidates = [location].concat(location.split('\n').reverse());
  for (var ci = 0; ci < candidates.length; ci++) {
    var seg = candidates[ci].trim();
    for (var city in CITY_COORDS) {
      if (seg.indexOf(city) >= 0) return CITY_COORDS[city];
    }
  }
  return null;
}

function tryGeocode(c) {
  if (!c.location || _geocodePending[c.id]) return;
  _geocodePending[c.id] = true;
  var q = c.location.replace(/\n/g, ', ') + ', ישראל';
  fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=il&q=' + encodeURIComponent(q))
    .then(function(r) { return r.json(); })
    .then(function(results) {
      if (!results || !results[0]) return;
      var r0 = results[0];
      var d = load();
      var cart = d.find(function(x) { return x.id === c.id; });
      if (cart && !cart._geocodedCoords) {
        cart._geocodedCoords = {lat: parseFloat(r0.lat), lng: parseFloat(r0.lon)};
        save(d);
        deferRender();
      }
    })
    .catch(function() { delete _geocodePending[c.id]; });
}

function distKmFull(c) {
  if (userLat === null) return null;
  var wazeUrl = (c.id && WAZE_COORDS[c.id]) ? WAZE_COORDS[c.id] : c.waze;
  var coords = parseWazeCoords(wazeUrl);
  var approx = false;
  if (!coords) {
    coords = cityLookup(c.location);
    if (coords) approx = true;
  }
  if (!coords && c._geocodedCoords) {
    coords = c._geocodedCoords;
    approx = true;
  }
  if (!coords && c.location && !_geocodePending[c.id]) {
    // No match yet — kick off async geocoding; result will appear on next render
    tryGeocode(c);
  }
  if (!coords) return null;
  return { km: haversine(userLat, userLng, coords.lat, coords.lng), approx: approx };
}

function distKm(c) {
  var r = distKmFull(c);
  return r ? r.km : null;
}

function save(d) {

}

function igUsername(url) {
  if (!url) return null;
  var m = url.match(/instagram\.com\/([^/?#\n]+)/);
  if (!m) return null;
  var seg = m[1].split('/').filter(Boolean);
  return (seg[0] === 'reel' || seg[0] === 'p') ? null : seg[0];
}

function openIG(e, url) {
  e.preventDefault();
  var isAndroid = /Android/i.test(navigator.userAgent);
  var username = igUsername(url);
  var m = url.match(/instagram\.com(\/[^?#]*)/);
  var igPath = m ? m[1] : '/';
  if (!igPath.endsWith('/')) igPath += '/';

  if (isAndroid) {
    // Chrome Android: intent:// opens app directly; S.browser_fallback_url handles "not installed"
    var fallback = encodeURIComponent('https://www.instagram.com' + igPath);
    var intentUrl = 'intent://www.instagram.com' + igPath
      + '#Intent;scheme=https;package=com.instagram.android;S.browser_fallback_url=' + fallback + ';end';
    window.location.href = intentUrl;
  } else if (username) {
    // iOS Safari: deep-link into app, fallback to web after 1.5s
    var appUrl = 'instagram://user?username=' + username;
    var start = Date.now();
    window.location = appUrl;
    setTimeout(function() {
      if (Date.now() - start < 2000) window.open(url, '_blank');
    }, 1500);
  } else {
    window.open(url, '_blank');
  }
}

function filtered(data) {

    if (!filterVal) return true;
    var q = filterVal.toLowerCase();
    return (c.name||'').toLowerCase().indexOf(q) >= 0 || (c.location||'').toLowerCase().indexOf(q) >= 0;
  });
  if (sortByDist && userLat !== null) {
    arr.sort(function(a, b) {
      var da = distKm(a), db = distKm(b);
      if (da === null && db === null) return 0;
      if (da === null) return 1;
      if (db === null) return -1;
      return da - db;
    });
  }
  return arr;
}

function showAddStep1() {

  document.getElementById('modal-step2').style.display = 'none';

function searchWithClaude() {
  var name = document.getElementById('f-name').value.trim();
  var city = document.getElementById('f-city').value.trim();
  if (!name) { document.getElementById('f-name').focus(); return; }

  document.getElementById('modal-step1').style.display = 'none';
  document.getElementById('modal-step-loading').style.display = 'block';

  var systemPrompt = 'ענה JSON בלבד: {"found":true,"name":"","sub":"","location":"","hours":"","waze":"","ig":""}. location="עיר,רחוב". hours="א׳–ה׳:HH:MM–HH:MM|ו׳:HH:MM–HH:MM|ש׳:סגור". waze=https://waze.com/ul?ll=LAT,LNG&navigate=yes (חלץ LAT,LNG מ-URL של Google Maps בפורמט @LAT,LNG). ig=קישור Instagram. שדה לא נמצא — ריק.';
  var userMsg = '"' + name + '" ' + (city || 'ישראל') + ' — חפש Google Maps, החזר JSON.';

  var messages = [{ role: 'user', content: userMsg }];

  function callClaude(msgs) {
    return fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': CLAUDE_API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-beta': 'web-search-2025-03-05',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 300,
        tools: [{ type: 'web_search_20250305', name: 'web_search', max_uses: 2 }],
        system: systemPrompt,
        messages: msgs
      })
    }).then(function(res) {
      if (!res.ok) return res.json().then(function(e) {
        var msg = (e.error && e.error.message) || '';
        if (res.status === 429 || msg.toLowerCase().indexOf('rate limit') >= 0 || msg.toLowerCase().indexOf('overloaded') >= 0) {
          throw new Error('rate_limit');
        }
        throw new Error(msg || 'API error ' + res.status);
      });
      return res.json();
    });
  }

  function handleClaudeResponse(data) {
    if (data.stop_reason === 'tool_use') {
      // Claude is searching the web — send back tool results to continue
      messages.push({ role: 'assistant', content: data.content });
      var toolResults = (data.content || [])
        .filter(function(b) { return b.type === 'tool_use'; })
        .map(function(b) { return { type: 'tool_result', tool_use_id: b.id, content: [] }; });
      messages.push({ role: 'user', content: toolResults });
      return callClaude(messages).then(handleClaudeResponse);
    }
    var text = '';
    (data.content || []).forEach(function(b) { if (b.type === 'text') text += b.text; });
    var match = text.match(/\{[\s\S]*\}/);
    if (!match) throw new Error('Claude לא החזיר JSON תקין. נסה שוב.');
    claudeResult = JSON.parse(match[0]);
    showAddStep2(claudeResult, name, city);
  }

  callClaude(messages)
    .then(handleClaudeResponse)
    .catch(function(err) {
      document.getElementById('modal-step-loading').style.display = 'none';
      document.getElementById('modal-step-error').style.display = 'block';
      var msg = err.message || '';
      if (msg === 'rate_limit') {
        document.getElementById('claude-error-msg').textContent = '⏳ הגעת למגבלת השימוש ב-API. המתן כמה דקות ונסה שוב.';
      } else {
        document.getElementById('claude-error-msg').textContent = '❌ ' + (msg || 'שגיאה לא ידועה');
      }
    });
}

function showAddStep2(result, fallbackName, fallbackCity) {
  document.getElementById('modal-step-loading').style.display = 'none';
  var preview = document.getElementById('claude-preview');
  var loc = result.location || fallbackCity || '';
  var wazeUrl = result.waze || '';
  if (!wazeUrl && loc) {
    wazeUrl = 'https://waze.com/ul?q=' + encodeURIComponent(loc + ' ישראל') + '&navigate=yes';
  }
  preview.innerHTML =
    mkPreviewField('שם', 'p-name', result.name || fallbackName) +
    mkPreviewField('תיאור קצר', 'p-sub', result.sub || '') +
    mkPreviewField('מיקום', 'p-location', loc) +
    mkPreviewField('שעות פתיחה', 'p-hours', result.hours || '') +
    mkPreviewField('Instagram', 'p-ig', result.ig || '') +
    mkPreviewField('Waze URL', 'p-waze', wazeUrl);
  document.getElementById('modal-step2').style.display = 'block';

  // If Claude returned a q= address URL, geocode it live to get exact ll= coordinates
  var qMatch = wazeUrl.match(/[?&]q=([^&]+)/);
  if (qMatch && !wazeUrl.match(/ll=/)) {
    var addr = decodeURIComponent(qMatch[1].replace(/\+/g, ' '));
    if (addr.indexOf('ישראל') < 0) addr += ' ישראל';
    var wazeField = document.getElementById('p-waze');
    wazeField.style.opacity = '0.5';
    fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=il&q=' + encodeURIComponent(addr))
      .then(function(r) { return r.json(); })
      .then(function(results) {
        if (!results || !results[0]) return;
        var lat = parseFloat(results[0].lat).toFixed(7);
        var lng = parseFloat(results[0].lon).toFixed(7);
        wazeField.value = 'https://waze.com/ul?ll=' + lat + ',' + lng + '&navigate=yes';
        wazeField.style.opacity = '1';
      })
      .catch(function() { wazeField.style.opacity = '1'; });
  }
}

function mkPreviewField(label, id, value) {
  return '<div class="preview-field">'
    + '<div class="field-label">' + label + '</div>'
    + '<input id="' + id + '" value="' + esc(value) + '" placeholder="—">'
    + '</div>';
}

  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block'; t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.style.opacity = '0'; setTimeout(function() { t.style.display = 'none'; }, 300); }, 2800);
}

dbRef.on('value', function(snapshot) {
  var raw = snapshot.val();
  if (raw) {
    localData = Array.isArray(raw) ? raw : Object.values(raw).filter(Boolean);
    // Patch carts missing an image — assign a deterministic Splash photo
    var patched = false;
    localData.forEach(function(c) {
      if (!c.img) {
        c.img = SPLASH_IMGS[(c.id || Date.now()) % SPLASH_IMGS.length];
        patched = true;
      }
    });
    if (patched) dbRef.set(localData).catch(function() {});
  } else {
    // First time — seed Firebase from INITIAL
    localData = INITIAL.map(function(ic) { return Object.assign({}, ic); });
    dbRef.set(localData).catch(function() { showToast('❌ שגיאת שמירה'); });
  }
  deferRender();
});
